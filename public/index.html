<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FiveM Clothing Tracker</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233e7bfa' stroke-width='2' stroke-linejoin='round'><path d='M16 3l5 3-2 4-2-1v11H7V9L5 10 3 6l5-3a4 4 0 0 0 8 0z'/></svg>">
</head>
<body>

  <!-- ============ LOGIN / REGISTER SCREEN ============ -->
  <div id="auth-screen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="logo">
        <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M16 3l5 3-2 4-2-1v11H7V9L5 10 3 6l5-3a4 4 0 0 0 8 0z"/></svg></span>
        <h1>FiveM <span>Clothing Tracker</span></h1>
      </div>
      <p class="auth-sub">Keep track of every clothing item &amp; ped — shared with your whole crew.</p>

      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab active">Log in</button>
        <button id="tab-register" class="auth-tab">Create account</button>
      </div>

      <form id="auth-form">
        <label>Username
          <input type="text" id="auth-username" autocomplete="username" maxlength="24" required>
        </label>
        <label>Password
          <input type="password" id="auth-password" autocomplete="current-password" required>
        </label>
        <div id="auth-error" class="auth-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-block" id="auth-submit">Log in</button>
      </form>
    </div>
  </div>

  <!-- ============ MAIN APP ============ -->
  <div id="app-screen" class="hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="logo small">
          <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M16 3l5 3-2 4-2-1v11H7V9L5 10 3 6l5-3a4 4 0 0 0 8 0z"/></svg></span>
          <h1>FiveM <span>Clothing Tracker</span></h1>
        </div>
        <nav class="section-tabs" id="section-tabs">
          <button class="section-tab active" data-section="home">Home</button>
          <button class="section-tab" data-section="male">Male <span class="count" data-count="male"></span></button>
          <button class="section-tab" data-section="female">Female <span class="count" data-count="female"></span></button>
          <button class="section-tab" data-section="factions">Factions <span class="count" data-count="factions"></span></button>
          <button class="section-tab" data-section="paid">Paid <span class="count" data-count="paid"></span></button>
          <button class="section-tab" data-section="gang">Gang <span class="count" data-count="gang"></span></button>
          <button class="section-tab" data-section="ped">Peds <span class="count" data-count="ped"></span></button>
        </nav>
        <div class="topbar-right">
          <span class="whoami"><b id="whoami"></b></span>
          <button id="logout-btn" class="btn btn-ghost btn-sm">Log out</button>
        </div>
      </div>
    </header>

    <div class="toolbar hidden" id="toolbar">
      <div class="toolbar-inner">
        <input type="search" id="search" placeholder="Search name, slot #, gang, owner, notes...">
        <select id="category-filter" title="Category">
          <option value="">All categories</option>
        </select>
        <select id="status-filter" title="Status">
          <option value="">Any status</option>
          <option>Good</option>
          <option>Vacant</option>
          <option>Needs Approval</option>
          <option>Needs Removal</option>
          <option>Broken</option>
          <option>Removed</option>
        </select>
        <button id="add-btn" class="btn btn-primary">+ Add</button>
      </div>
    </div>

    <div class="app-body">
      <aside class="sidebar">
        <div class="panel">
          <div class="panel-head">Online <span id="online-count" class="panel-badge"></span></div>
          <div id="online-list" class="panel-list"></div>
        </div>
        <div class="panel">
          <div class="panel-head">Activity <span id="activity-count" class="panel-badge"></span></div>
          <div id="activity-list" class="panel-list activity"></div>
        </div>
      </aside>

      <main class="content">
        <div id="home-view">
          <h2 class="home-title">Dashboard</h2>
          <div class="stat-grid">
            <button class="stat-tile" data-goto="male"><span class="stat-num" data-count="male">0</span><span class="stat-label">Male items</span></button>
            <button class="stat-tile" data-goto="female"><span class="stat-num" data-count="female">0</span><span class="stat-label">Female items</span></button>
            <button class="stat-tile" data-goto="factions"><span class="stat-num" data-count="factions">0</span><span class="stat-label">Faction items</span></button>
            <button class="stat-tile" data-goto="paid"><span class="stat-num" data-count="paid">0</span><span class="stat-label">Paid items</span></button>
            <button class="stat-tile" data-goto="gang"><span class="stat-num" data-count="gang">0</span><span class="stat-label">Gang items</span></button>
            <button class="stat-tile" data-goto="ped"><span class="stat-num" data-count="ped">0</span><span class="stat-label">Peds</span></button>
          </div>
          <div class="panel board-panel">
            <div class="panel-head">Important information
              <button id="board-edit" class="icon-btn" title="Edit board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 3 21l.5-4.5z"/></svg></button>
            </div>
            <div id="board-content" class="board-content"></div>
            <div id="board-meta" class="board-meta hidden"></div>
            <div id="board-editor" class="board-editor hidden">
              <textarea id="board-text" rows="6" maxlength="5000" placeholder="Rules, pack updates, slot bookings, anything the crew needs to know..."></textarea>
              <div class="board-editor-actions">
                <button id="board-cancel" class="btn btn-ghost btn-sm">Cancel</button>
                <button id="board-save" class="btn btn-primary btn-sm">Save</button>
              </div>
            </div>
          </div>

          <div class="panel">
            <div class="panel-head">Recent activity <span id="home-activity-count" class="panel-badge"></span></div>
            <div id="home-activity" class="home-activity"></div>
          </div>
        </div>

        <div id="list-view" class="hidden">
          <div id="gender-tabs" class="gender-tabs hidden">
            <button class="gender-tab active" data-gender="male">Male <span id="gender-count-male" class="count"></span></button>
            <button class="gender-tab" data-gender="female">Female <span id="gender-count-female" class="count"></span></button>
          </div>
          <div id="result-info" class="result-info"></div>
          <div id="list" class="list"></div>
          <div id="empty-state" class="empty-state hidden">
            <p>Nothing here.</p>
            <p class="empty-sub">Hit <b>+ Add</b> to start the collection, or clear your filters.</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- ============ ADD / EDIT MODAL ============ -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal">
      <h2 id="modal-title">Add item</h2>
      <form id="item-form">
        <label>Name *
          <input type="text" id="item-name" maxlength="80" required placeholder="e.g. Black Hoodie">
        </label>
        <div class="row-2">
          <label>Category *
            <select id="item-category"></select>
          </label>
          <label id="gender-wrap">For
            <select id="item-gender">
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </label>
        </div>
        <input type="text" id="item-category-custom" class="hidden" maxlength="60" placeholder="Type a custom category">
        <div class="row-2">
          <label><span id="drawable-label">File / Drawable #</span>
            <input type="text" id="item-drawable" maxlength="60" placeholder="e.g. 015">
          </label>
          <label id="texture-wrap">Textures
            <input type="text" id="item-texture" maxlength="60" placeholder="e.g. 3">
          </label>
        </div>
        <div class="row-2">
          <label id="status-wrap">Status
            <select id="item-status">
              <option value="">—</option>
              <option>Good</option>
              <option>Vacant</option>
              <option>Needs Approval</option>
              <option>Broken</option>
              <option>Removed</option>
            </select>
          </label>
          <label id="gang-wrap">Gang
            <input type="text" id="item-gang" maxlength="60" placeholder="e.g. Triads">
          </label>
        </div>
        <label>Picture
          <div class="img-input-row">
            <input type="file" id="item-image-file" accept="image/*">
            <input type="text" id="item-image-url" placeholder="...or paste an image URL">
          </div>
        </label>
        <div id="img-preview-wrap" class="img-preview hidden">
          <img id="img-preview" alt="preview">
          <button type="button" id="img-remove" class="btn btn-ghost btn-sm">Remove picture</button>
        </div>
        <label>Notes
          <textarea id="item-notes" rows="2" maxlength="500" placeholder="Owner, discord ID, poly count, anything useful..."></textarea>
        </label>
        <div id="item-error" class="auth-error hidden"></div>
        <div class="modal-actions">
          <button type="button" id="modal-cancel" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary" id="modal-save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
